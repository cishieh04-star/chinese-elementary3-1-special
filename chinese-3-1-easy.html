<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字的小旅行・國字氣球（含描字）</title>
<style>
:root{--ink:#1f3b5a;--sun:#ffd24d;--sun2:#e0a800;--green:#37c9b1;--green2:#1fa58f;--blue:#4aa8f0;--blue2:#2a86cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:700;color:var(--ink);background:linear-gradient(#7fcfff,#bfe8ff 55%,#e8f8ff);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:.45rem;padding:.5rem .6rem;background:rgba(255,255,255,.85);border-bottom:.2rem solid #cde6f7;flex:none}
.dots{flex:1;display:flex;gap:.15rem;justify-content:center;flex-wrap:wrap;font-size:1.15rem;min-width:4rem}

.gsel{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.gsel button{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.2rem solid #cde6f7;font-size:1.15rem}.gsel button.on{background:#fff3c4;border-color:#e0a800}
.dots i{font-style:normal;opacity:.3;filter:grayscale(1)}
.dots i.on{opacity:1;filter:none}
.ib{min-width:3rem;height:3rem;border-radius:1rem;background:#fff;box-shadow:0 .2rem 0 #a9cbe3;font-size:1rem;flex:none;padding:0 .4rem;line-height:1.1}
.ib{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.8rem;height:3.6rem;gap:.05rem}
.ib .ic{font-size:1.25rem;line-height:1.1}
.ib small{font-size:.72rem;color:#3d5a7a;white-space:nowrap;line-height:1.1}
.ib.on{background:var(--sun);box-shadow:0 .2rem 0 var(--sun2)}
.ib:active{transform:translateY(.2rem);box-shadow:none}
.main{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.9rem;gap:.8rem;text-align:center;position:relative}
.btn{min-height:3.8rem;padding:.5rem 1.4rem;border-radius:1.4rem;font-size:1.5rem;background:var(--green);color:#fff;box-shadow:0 .35rem 0 var(--green2);white-space:nowrap}
.btn:active{transform:translateY(.3rem);box-shadow:none}
.btn.y{background:var(--sun);color:#5a3b00;box-shadow:0 .35rem 0 var(--sun2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .35rem 0 #a9cbe3}
.btn:disabled{opacity:.35}
.pcards{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.pcard{position:relative;width:min(10rem,29vw);height:min(10rem,29vw);border-radius:1.6rem;background:#fff;box-shadow:0 .4rem 0 #a9cbe3;border:.25rem solid #cde6f7;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.pcard .pe{font-size:min(5.6rem,17vw);line-height:1}
.pcard .osp{position:absolute;right:.3rem;top:.3rem;font-size:1.05rem;background:#eef6ff;border-radius:.7rem;padding:.25rem .35rem;line-height:1}
.pcard:active{transform:translateY(.3rem);box-shadow:none}
.pcard.ok{background:#fffbe0;border-color:#ffd24d;animation:pop2 .5s}
.pcard.bad{opacity:.25;pointer-events:none;animation:shake2 .4s}
.pcard.dim{opacity:.25}
.pcard.glow{box-shadow:0 0 1.6rem .7rem var(--sun),0 .4rem 0 #a9cbe3}
@keyframes pop2{50%{transform:scale(1.15)}}
@keyframes shake2{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
.pond{position:relative;flex:1;width:100%;max-width:56rem;min-height:24rem;border-radius:1.6rem;overflow:hidden;background:linear-gradient(#bfe8ff 0,#e6f6ff 9.6rem,#5cc0ec 9.6rem,#2a86cf 100%);box-shadow:0 .4rem 0 rgba(40,110,170,.25)}
.pond::before{content:'';position:absolute;left:0;right:0;top:9rem;height:1.2rem;background:radial-gradient(circle at .8rem -.2rem,transparent 0 .75rem,#5cc0ec .8rem) 0 0/1.6rem 1.2rem repeat-x;animation:wv 3s linear infinite}
@keyframes wv{to{background-position:1.6rem 0}}
.sun2{position:absolute;right:4%;top:.5rem;font-size:2.6rem}
.reed{position:absolute;bottom:-.3rem;font-size:3rem}.reed.l{left:.4rem}.reed.r{right:.4rem}
.boatw{position:absolute;left:50%;top:.4rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.sign{background:#fff;border:.25rem solid #8a5a2b;border-radius:1rem;padding:0 .7rem;font-size:min(4.2rem,13vw);line-height:1.35;color:#1d4f86;box-shadow:0 .3rem 0 #6e451c;cursor:pointer}
.sign rt{font-size:.24em}
.boatline{position:relative;margin-top:-.6rem;line-height:1}.boatline .bt{font-size:3.4rem;display:inline-block;animation:bob 2.6s ease-in-out infinite}.boatline .rod{position:absolute;right:-1.9rem;top:-.4rem;font-size:2rem}
.fish{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);background:none;padding:0;z-index:1;animation:swim var(--d) ease-in-out infinite;animation-delay:var(--dl);transition:transform 1.1s cubic-bezier(.4,.1,.3,1),opacity .4s}
@keyframes swim{0%,100%{transform:translate(-50%,-50%) translateX(-1.1rem)}50%{transform:translate(-50%,-50%) translateX(1.1rem) translateY(-.5rem)}}
.fish .fb{position:relative;display:flex;align-items:center;justify-content:center;width:min(9.5rem,30vw);height:min(6.4rem,20vw);background:var(--c);border-radius:50% 45% 45% 50%/55% 50% 50% 55%;box-shadow:inset 0 -.5rem 0 rgba(0,0,0,.1),0 .35rem 0 rgba(0,40,80,.25);border:.2rem solid #fff}
.fish .fb::after{content:'';position:absolute;right:-1.7rem;top:50%;transform:translateY(-50%);border-left:2.2rem solid var(--c);border-top:1.5rem solid transparent;border-bottom:1.5rem solid transparent}
.fish.flip .fb::after{right:auto;left:-1.7rem;border-left:0;border-right:2.2rem solid var(--c)}
.fish .eye{position:absolute;left:12%;top:28%;width:.8rem;height:.8rem;border-radius:50%;background:#223;box-shadow:0 0 0 .2rem #fff}
.fish.flip .eye{left:auto;right:12%}
.fish .pe{font-size:min(3.6rem,11vw);background:rgba(255,255,255,.9);border-radius:50%;width:min(5rem,16vw);height:min(5rem,16vw);display:flex;align-items:center;justify-content:center;line-height:1}
.fish .osp{position:absolute;right:-.4rem;top:-.7rem;font-size:1.05rem;background:#eef6ff;border-radius:.7rem;padding:.25rem .35rem;line-height:1;z-index:2}
.fish.glow .fb{box-shadow:0 0 1.6rem .7rem var(--sun),0 .35rem 0 rgba(0,40,80,.25)}
.fish.dim{opacity:.3}
.fish.away{animation:away 1.3s ease-in forwards;pointer-events:none}
@keyframes away{to{transform:translate(-50%,-50%) translateX(70vw) translateY(2rem);opacity:0}}
.fish.flip.away{animation-name:away2}@keyframes away2{to{transform:translate(-50%,-50%) translateX(-70vw) translateY(2rem);opacity:0}}
.fish.caught{animation:none;z-index:3}
.fline{position:absolute;width:.18rem;background:#fff;opacity:.9;z-index:2;transition:height 1.1s cubic-bezier(.4,.1,.3,1),left 1.1s;pointer-events:none}
.splash{position:absolute;transform:translate(-50%,-50%);font-size:1.8rem;font-weight:900;color:#fff;text-shadow:0 .15rem 0 #1d5f99;z-index:4;pointer-events:none;animation:sp 1.2s forwards}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}30%{opacity:1;transform:translate(-50%,-90%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%)}}
@media (max-height:640px){.pond{min-height:20rem}}
.btn.skip.fr{background:#3ecf72;box-shadow:0 .35rem 0 #22a653}
.zcard{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:1.6rem;padding:.2rem 1.4rem;box-shadow:0 .4rem 0 rgba(40,110,170,.2);cursor:pointer;border:.25rem solid #cde6f7}
.zcard .zz{font-size:min(4.4rem,14vw);color:#c0391f;letter-spacing:.12em;line-height:1.3;font-family:"BopomofoRuby","PingFang TC","Noto Sans TC",sans-serif}
.zcard .zs{font-size:1.6rem}
.lake{position:relative;flex:1;width:100%;max-width:56rem;min-height:19rem;border-radius:1.6rem;overflow:hidden;background:radial-gradient(ellipse at 20% 80%,rgba(255,255,255,.25) 0 2rem,transparent 2.1rem),radial-gradient(ellipse at 80% 15%,rgba(255,255,255,.2) 0 1.6rem,transparent 1.7rem),linear-gradient(#7fd3f2,#3aa3d9);box-shadow:0 .4rem 0 rgba(40,110,170,.25)}
.lotus{position:absolute;font-size:2.2rem}.lotus.a{left:4%;top:6%}.lotus.b{right:5%;bottom:8%}
.pad2{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:min(10rem,30vw);height:min(7.4rem,22vw);border-radius:50%;background:radial-gradient(ellipse at 38% 32%,#d8ffc9 0 8%,#7fd35f 9%,#3f9e34);border:.25rem solid #2f7d27;box-shadow:inset 0 -.5rem 0 rgba(0,60,0,.2),0 .4rem 0 rgba(0,50,90,.3);display:flex;align-items:center;justify-content:center;animation:float 3.4s ease-in-out infinite;animation-delay:var(--dl);transition:opacity .4s}
.pad2::before{content:'';position:absolute;right:-.2rem;top:30%;width:2.4rem;height:.7rem;background:#4fb6e8;border-radius:.4rem;transform:rotate(22deg)}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-50%) translateY(-.4rem) rotate(2deg)}}
.pad2 .pc{font-size:min(4.4rem,14vw);color:#123d10;line-height:1;text-shadow:0 .12rem 0 rgba(255,255,255,.6)}
.pad2 .osp{position:absolute;left:.2rem;top:-.4rem;font-size:1.05rem;background:#eef6ff;border-radius:.7rem;padding:.25rem .35rem;line-height:1}
.pad2.glow{box-shadow:0 0 1.6rem .7rem var(--sun),0 .4rem 0 rgba(0,50,90,.3)}
.pad2.dim{opacity:.35}
.pad2.ok{background:radial-gradient(ellipse at 38% 32%,#fff7c9 0 8%,#b8e65f 9%,#6fae34)}
.pad2.sink{animation:sink .9s forwards;pointer-events:none}
@keyframes sink{to{transform:translate(-50%,-30%) scale(.7);opacity:.2;filter:grayscale(1)}}
.frog2{position:absolute;left:50%;bottom:.3rem;margin-left:-1.8rem;font-size:3.6rem;line-height:1;z-index:3;transition:transform .75s cubic-bezier(.3,1.5,.5,1)}
.frog2.hop{animation:hop .75s}
@keyframes hop{50%{filter:drop-shadow(0 1.2rem .4rem rgba(0,0,0,.25))}}
.btn.skip.pk{background:#9b6bff;box-shadow:0 .35rem 0 #7647e0}
.btn.skip{background:#4aa8f0;box-shadow:0 .35rem 0 #2a86cf;font-size:1.35rem;min-height:3.4rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border-radius:2rem;padding:.8rem 1.3rem;box-shadow:0 .4rem 0 rgba(40,110,170,.2);max-width:34rem;width:100%}
.tag{background:#fff;border-radius:99px;padding:.3rem 1.2rem;font-size:1.15rem;box-shadow:0 .2rem 0 #a9cbe3}
.pic{font-size:5.2rem;line-height:1.2;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.4rem)}}
.big{font-size:min(7.5rem,20vh,28vw);line-height:1.3;cursor:pointer;color:#1d4f86}
.word{font-size:2.3rem;line-height:1.9;cursor:pointer}
.say{font-size:1.45rem;line-height:2.3;cursor:pointer;text-align:left;margin:.2rem 0}
.say.fun{background:#fff7d6;border-radius:1rem;padding:.2rem .7rem}
ruby{ruby-position:over}
rt{font-size:.36em;color:#c0391f;font-weight:700}
.big rt{font-size:.22em}
.zyoff rt{visibility:hidden}
.hl{background:#fff0a8;border-radius:.4rem;padding:0 .1rem;color:#c0391f}
.box{display:inline-block;width:1.1em;height:1.1em;line-height:1.1em;border:.2rem dashed var(--blue2);border-radius:.4rem;color:var(--blue2);background:#e9f5ff;vertical-align:middle}
/* 天空與雲朵 */
.ask{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:1.6rem;padding:.4rem 1rem;box-shadow:0 .35rem 0 rgba(40,110,170,.2);flex:none;flex-wrap:wrap;justify-content:center}
.ask .pic{font-size:3.4rem}
.sky{position:relative;flex:1;width:100%;min-height:17rem;max-width:56rem}
.sunny{position:absolute;right:4%;top:2%;font-size:3.4rem;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:var(--x);top:var(--y);width:min(14rem,40vw);height:min(6.6rem,19vw);background:#fff;border-radius:5rem;box-shadow:0 .45rem 0 #a9cbe3;animation:sway var(--d) ease-in-out infinite;animation-delay:var(--dl);display:flex;align-items:flex-end;justify-content:center;padding-bottom:.2rem}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;z-index:0}
.cloud::before{width:44%;height:105%;left:13%;top:-48%}
.cloud::after{width:38%;height:88%;right:13%;top:-36%}
.cloud .ch{position:relative;z-index:1;font-size:min(4.8rem,14vw);line-height:1.15;color:#1d4f86}
.cloud .face{position:absolute;z-index:1;bottom:.1rem;right:1rem;font-size:1.1rem;opacity:.8}
.cloud .osp{position:absolute;z-index:2;left:.5rem;bottom:.4rem;font-size:1.05rem;background:#eef6ff;border-radius:.7rem;padding:.25rem .35rem;line-height:1}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) translateX(-1.4rem)}50%{transform:translate(-50%,-50%) translateX(1.4rem) translateY(-.7rem)}}
.cloud.bad{animation:poof .6s forwards;pointer-events:none}
@keyframes poof{to{transform:translate(-50%,-50%) scale(.8);opacity:.25;filter:grayscale(1)}}
.cloud.ok{animation:yay .8s forwards;background:#fffbe0}
.cloud.ok::before,.cloud.ok::after{background:#fffbe0}
@keyframes yay{50%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1.1)}}
.cloud.glow{box-shadow:0 0 1.6rem .7rem var(--sun),0 .45rem 0 #a9cbe3}
.cloud.dim{opacity:.25;transition:opacity .4s}
.drop{position:absolute;font-size:1.6rem;pointer-events:none;z-index:3;animation:drop 1.1s ease-in forwards}
@keyframes drop{to{transform:translateY(9rem);opacity:0}}
.rain{position:absolute;font-size:3rem;z-index:3;pointer-events:none;animation:rainbow 1.6s forwards}
@keyframes rainbow{0%{transform:translate(-50%,0) scale(.3);opacity:0}30%{transform:translate(-50%,-2rem) scale(1.3);opacity:1}100%{transform:translate(-50%,-4rem) scale(1);opacity:0}}
.stk{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;min-height:2rem;font-size:1.5rem;flex:none}
.praise{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-size:2.5rem;color:#fff;background:linear-gradient(#ffc233,#ff8a3d);padding:.4rem 1.8rem;border-radius:99px;z-index:9;pointer-events:none;box-shadow:0 .4rem 0 #d9631a;animation:pr 1.5s forwards;white-space:nowrap}
@keyframes pr{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.conf{position:fixed;top:-3rem;font-size:2rem;z-index:8;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6rem,1fr));gap:.6rem;max-width:38rem;width:100%}
.grid button{background:#fff;border-radius:1.2rem;padding:.4rem;box-shadow:0 .25rem 0 #a9cbe3;font-size:1.8rem;line-height:1.5}
.grid button small{display:block;font-size:2rem}
.title{font-size:min(3rem,10vw);color:#fff;text-shadow:0 .2rem 0 #2a86cf,0 .4rem 0 #1d5f99;letter-spacing:.08em}
.hint{font-size:1.1rem;color:#4a6585}
.modalbg{position:fixed;inset:0;background:rgba(20,50,90,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:1rem}
.modalbg .card{max-height:92%;overflow:auto;text-align:center}
@media (max-height:640px){.pic{font-size:3.6rem}.word{font-size:1.8rem}.say{font-size:1.2rem;line-height:2.1}.btn{min-height:3.1rem;font-size:1.25rem}.sky{min-height:14rem}}
/* 國字氣球（取自 6-1 詞語氣球的樣式） */
.bwrap{position:relative;flex:1;width:100%;max-width:56rem;min-height:17rem;display:flex;align-items:center;justify-content:center}
.balloons{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2.4rem 1.8rem;padding:1rem 0 2rem}
.balloon{position:relative;border:0;width:min(10rem,28vw);aspect-ratio:.86;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;color:#fff;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:inset -10px -12px 0 rgba(0,0,0,.14),inset 8px 8px 0 rgba(255,255,255,.3),0 .4rem 0 rgba(0,0,0,.1);animation:bob2 3s ease-in-out infinite}
.balloon:nth-child(2){animation-delay:-1s}.balloon:nth-child(3){animation-delay:-2s}
.balloon::after{content:"";position:absolute;left:50%;bottom:-2.2rem;width:2px;height:2.2rem;background:rgba(0,0,0,.35)}
.balloon::before{content:"";position:absolute;left:50%;bottom:-.45rem;margin-left:-.4rem;border-left:.4rem solid transparent;border-right:.4rem solid transparent;border-bottom:.6rem solid var(--bc)}
.balloon .ch{font-size:min(5rem,15vw);line-height:1;text-shadow:0 .15rem 0 rgba(0,0,0,.25)}
.balloon .osp{position:absolute;left:-.4rem;top:-.4rem;font-size:1.05rem;background:#eef6ff;border-radius:.7rem;padding:.25rem .35rem;line-height:1}
.balloon.b0{--bc:#e94b4b;background:#e94b4b}.balloon.b1{--bc:#2f7fe0;background:#2f7fe0}.balloon.b2{--bc:#f0a020;background:#f0a020}.balloon.b3{--bc:#2fb070;background:#2fb070}
@keyframes bob2{50%{transform:translateY(-.8rem)}}
.balloon.popped{animation:popb .45s forwards;pointer-events:none}
@keyframes popb{60%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.balloon.bad{opacity:.3;filter:grayscale(1);pointer-events:none}
.balloon.dim{opacity:.3}
.balloon.glow{box-shadow:0 0 1.6rem .7rem var(--sun),inset -10px -12px 0 rgba(0,0,0,.14)}
.bird[hidden]{display:none}
.bird{position:absolute;left:.5rem;top:.5rem;z-index:6;font-size:3.4rem;line-height:1;pointer-events:none;transition:transform 1.5s cubic-bezier(.45,.05,.3,1)}
.bird .bi{display:inline-block;animation:flap .25s ease-in-out infinite}
@keyframes flap{50%{transform:translateY(-.4rem) rotate(-8deg)}}
.perch{position:absolute;left:50%;top:-2.6rem;margin-left:-1.5rem;font-size:3rem;line-height:1;pointer-events:none;animation:sit 1s ease-in-out infinite}
@keyframes sit{50%{transform:translateY(-.25rem)}}
.boom{position:absolute;transform:translate(-50%,-50%);font-size:2.6rem;z-index:5;pointer-events:none;animation:sp 1s forwards}
.bigbtn{min-height:6rem;min-width:min(17rem,80vw);font-size:2rem;border-radius:2rem}
/* ===== 描字（穿插在原本的遊戲裡）===== */
.tr{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:100%}
.tr-ask{display:flex;align-items:center;gap:.5rem;min-height:2.6rem}
.tr-ask .pic{font-size:2.1rem;line-height:1}
.tr-ask .word{font-size:1.6rem;line-height:1.5}
.tr-ask .btn{min-height:2.4rem;font-size:1rem;padding:.2rem .7rem}
.tr-bw{width:min(98vw,calc(100vh - 16.6rem),34rem);aspect-ratio:1;flex:none;background:#fff;border-radius:.9rem;border:.2rem solid #cde6f7;box-shadow:0 .2rem 0 #a9cbe3;overflow:hidden}

.tr-bw svg{width:100%;height:100%;display:block;touch-action:none}
.tr-msg{min-height:1.3rem;font-size:1.05rem;line-height:1.3;color:#2a5a8a;flex:none}
.tr .btn{min-height:2.7rem;font-size:1.05rem;padding:.3rem .7rem}
.tr-dot{transform-box:fill-box;transform-origin:center;animation:trdp 1s infinite}
@keyframes trdp{50%{transform:scale(1.28)}}
.tr-shake{animation:trshk .4s}
@keyframes trshk{25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
.tr-flow{animation:trflow 1.1s linear infinite}

.tr-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f80ed,#00897b);transition:width .15s}
.tr-b.now{animation:trbl .9s ease-in-out infinite}
@keyframes trbl{50%{opacity:.35}}
.tr-b.past circle{fill:#9aa7b4}

  const up=()=>{if(PH!=='trace'||!ST||!ST.down)return;ST.down=false;
   if(!ST.lock){if(!check(true)){const gain=curCand().reduce((a,i)=>a+ST.covN[i],0)-ST.c0;ST.tries++;
    if(gain<4){ST.miss=(ST.miss||0)+1;msg('請描會動的這一筆');if(ST.miss%2===0)sy('請描，會動的這一筆。')}else{ST.miss=0;msg('沒關係，跟著虛線，再描一次')}
    if(ST.tries>=3){ST.tries=0;hintDemo()}else idleHint()}}
   ST.lock=false};
  s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up)}
 function completeStroke(i){if(ST.done.has(i))return;ST.done.add(i);ST.lock=true;ST.tries=0;fillStroke(i);
  const left=X.steps[ST.step].filter(j=>!ST.done.has(j));if(left.length||ST.step<X.steps.length-1)tone(880,.12,0);
  if(left.length===0){ST.step++;ST.ink='';el('ink').setAttribute('d','');
   if(ST.step>=X.steps.length){setBar(1);finish();return}drawStep();msg(['好棒！下一筆','描對了！','很好！繼續','太棒了！'][Math.floor(Math.random()*4)])}
  else{drawStep();msg('很好！再描另一筆')}
  idleHint()}
 function redo(){if(PH!=='trace'||!ST)return;for(const i of curCand()){ST.cov[i].fill(0);ST.covN[i]=0;ST.trav[i]=0}ST.ink='';el('ink').setAttribute('d','');ST.tries=0;hideHand();updBar();msg('重新描這一筆');idleHint()}
 /* 示範：只看，不會替小朋友描完 */
 async function hintDemo(){const g=GEN;PH='demo';hideHand();msg('看一看，再描一次');sy('看一看，再描一次。');
  for(const i of curCand()){if(!alive(g))return;if(!await animStroke(i,g,1))return;if(!await wait(250,g))return;el('an'+i).setAttribute('opacity','0')}
  if(alive(g)){PH='trace';idleHint()}}
 async function demoAll(){if(PH!=='trace')return;const g=GEN;PH='demo';hideHand();msg('看筆順');sy('看筆順。');
  for(let i=0;i<X.rg.length;i++){if(!alive(g))return;const fast=X.rg.length>12?.5:1;if(!await animStroke(i,g,fast))return;if(!await wait(fast<1?60:200,g))return;el('an'+i).setAttribute('opacity','0')}
  if(alive(g)){PH='trace';drawStep();idleHint()}}
 function stopDemo(){GEN++;clearTimeout(TM2);cancelAnimationFrame(RAF);X.rg.forEach((_,i)=>el('an'+i).setAttribute('opacity','0'));PH='trace';drawStep();idleHint()}
 function hideHand(){clearTimeout(HINTT);HGEN++;const h=el('hand');if(h)h.setAttribute('opacity','0')}
 function idleHint(){clearTimeout(HINTT);const g=GEN;HINTT=setTimeout(()=>{if(!alive(g)||PH!=='trace')return;const cand=curCand();if(!cand.length)return;const P=X.cp[cand[0]];const h=el('hand');const hg=++HGEN;h.setAttribute('opacity','1');
   (async()=>{while(hg===HGEN&&alive(g)){await tween(Math.max(900,P.length*60),p=>{const k=Math.min(P.length-1,Math.floor(p*(P.length-1)));h.setAttribute('x',P[k][0]);h.setAttribute('y',P[k][1]+70)},g);await wait(400,g)}})()},3500)}
 /* 完成 */
 function finish(){PH='done';hideHand();el('hl').innerHTML='';el('nums').innerHTML='';el('ink').setAttribute('d','');
  X.rg.forEach((_,i)=>fillStroke(i,COL));
  ding();confetti(18);praise('描好了！');msg(`「${C}」描好了！`);btns([]);
  const f=CB,g=GEN;let gone=false;
  const go=()=>{if(gone||!alive(g))return;gone=true;GEN++;clearTimeout(TM2);clearTimeout(HINTT);cancelAnimationFrame(RAF);if(f.done)f.done()};
  /* 先讓掌聲音效響完，再唸話，兩個聲音不要疊在一起 */
  setTimeout(()=>{if(alive(g)&&!gone)sy(`好棒！你描好了，${ph(X)}。`,()=>{if(alive(g))TM2=setTimeout(go,900)})},700);
  setTimeout(go,8000)}
 /* 描字時，手指滑動不要讓整個網頁跟著動（LINE、Safari 都適用） */
 document.addEventListener('touchmove',e=>{if(root&&root.isConnected&&(PH==='trace'||PH==='demo'||PH==='show')&&e.cancelable&&e.target.closest&&e.target.closest('.tr-bw'))e.preventDefault()},{passive:false});
})();

applySet();startScreen();
</script>
